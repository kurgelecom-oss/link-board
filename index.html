<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Board</title>

    <!-- DIAGNOSTIC OVERLAY — must stay the FIRST script on the page, and must
         stay plain ES5 (var, function, no arrow fns, no ?., no template
         literals). Its whole job is to survive an engine too old to parse the
         app, so anything modern in here would defeat the purpose: the browser
         would choke on the reporter and we would learn nothing.

         On any uncaught error or unhandled rejection it paints a dark overlay
         with the message, source, line/col and the UA string, so a device with
         no devtools — the Samsung Flip panel — can still show us what broke.
         A classic script's parse error does reach window.onerror, so a syntax
         failure in the app bundle surfaces here too. -->
    <script>
    (function () {
        var shown = 0;

        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function paint(title, msg, src, line, col, stack) {
            if (shown > 4) return;          // don't let an error loop bury the screen
            shown = shown + 1;
            if (!document.body) {
                document.addEventListener('DOMContentLoaded', function () {
                    paint(title, msg, src, line, col, stack);
                });
                return;
            }
            var box = document.createElement('div');
            box.setAttribute('data-diag', '1');
            box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;'
                + 'background:#1a0d0d;color:#ffd7d7;border-bottom:3px solid #ff5555;'
                + 'font:12px/1.45 monospace;padding:12px 14px;max-height:70%;overflow:auto;'
                + 'white-space:pre-wrap;word-break:break-word;text-align:left;';
            var html = '<b style="color:#ff8a8a">' + esc(title) + '</b>\n'
                + esc(msg) + '\n'
                + 'at: ' + esc(src || '(unknown)') + ':' + esc(line) + ':' + esc(col) + '\n'
                + 'UA: ' + esc(navigator.userAgent);
            if (stack) html = html + '\n\n' + esc(stack);
            html = html + '\n<button style="margin-top:8px;padding:6px 10px;'
                + 'background:#552222;color:#ffd7d7;border:1px solid #ff5555;'
                + 'border-radius:4px;font:12px monospace;width:auto;cursor:pointer">dismiss</button>';
            box.innerHTML = html;
            box.getElementsByTagName('button')[0].onclick = function () {
                box.parentNode.removeChild(box);
            };
            document.body.appendChild(box);
        }

        window.addEventListener('error', function (e) {
            var stack = e && e.error && e.error.stack ? e.error.stack : '';
            paint('Script error', e.message, e.filename, e.lineno, e.colno, stack);
        });

        window.addEventListener('unhandledrejection', function (e) {
            var r = e ? e.reason : null;
            var msg = r && r.message ? r.message : String(r);
            var stack = r && r.stack ? r.stack : '';
            paint('Unhandled promise rejection', msg, '(promise)', 0, 0, stack);
        });

        // Lets us confirm on the panel that the reporter itself is alive, without
        // waiting for a real failure: append ?diag=1 to the URL.
        if (window.location.search.indexOf('diag=1') !== -1) {
            window.addEventListener('load', function () {
                paint('Diagnostics active', 'No error yet - reporter is installed.',
                      location.href, 0, 0, '');
            });
        }
    })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1e2140;
            color: #e8e9ec;
            /* padding-top clears the fixed 40px nav, keeping the original 24px of air. */
            padding: 64px 20px 60px;
            min-height: 100vh;
        }

        /* ── TOP NAV ─────────────────────────────────────────────────
           Canonical nav shared across all six surfaces. Deliberately uses
           the family-dashboard palette (#252a4a / #00d4ff / Inter) rather
           than this app's colours, by tk ruling: the nav is one shared
           object and must read identically everywhere. */
        .topnav {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 40px;
            z-index: 800; /* below .top-bar (1000), modal (2000), lightbox (3000) */
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 0 10px;
            background: #252a4a;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            overflow-x: auto;
            scrollbar-width: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .topnav::-webkit-scrollbar { display: none; }

        .topnav-link {
            position: relative;
            flex-shrink: 0;
            padding: 0 10px;
            line-height: 40px;
            font-size: 12px;
            font-weight: 600;
            color: #8b92b8;
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.2s ease;
        }
        .topnav-link:hover { color: #ffffff; }
        .topnav-link.active { color: #00d4ff; }

        .topnav-link.active::after {
            content: "";
            position: absolute;
            left: 10px; right: 10px; bottom: 0;
            height: 2px;
            background: #00d4ff;
            border-radius: 1px 1px 0 0;
        }

        .top-bar {
            position: fixed;
            /* 15px of air below the fixed nav, matching the original top:15px. */
            top: 55px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        .top-bar a {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-decoration: none;
            color: #aab;
            transition: opacity 0.2s;
        }

        .top-bar a:hover {
            opacity: 0.7;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .page-subtitle {
            font-size: 14px;
            color: #7d8290;
            margin-top: 6px;
            margin-bottom: 24px;
        }

        .panel {
            background: #1c1f26;
            border: 1px solid #2a2d34;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .panel-header h2 {
            font-size: 16px;
            color: #fff;
        }

        .panel-close {
            background: none;
            border: none;
            color: #7d8290;
            font-size: 20px;
            cursor: pointer;
            padding: 4px 8px;
            width: auto;
            line-height: 1;
        }

        .panel-close:hover {
            color: #fff;
            background: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group:last-of-type {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #9aa0ac;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: #12141a;
            border: 1px solid #333844;
            border-radius: 9px;
            font-size: 15px;
            font-family: inherit;
            color: #eee;
        }

        input[type="text"]::placeholder {
            color: #5c6270;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4f8cff;
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.15);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #4f8cff;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #3f78e6;
        }

        button:active {
            background: #3468cc;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            /* Chromium 57-65 shipped grid gaps as grid-gap only; `gap` for grid
               landed in 66. Both are listed so the old panel spaces its tiles.
               Modern engines take the later `gap` and ignore the alias. */
            grid-gap: 14px;
            gap: 14px;
            /* No max-height or overflow here on purpose — the page just keeps
               growing/scrolling naturally as more tiles are added. */
        }

        /* aspect-ratio is Chrome 88+. On the Samsung Flip panel's older engine it
           is ignored, every tile collapses to zero height, and the board renders
           as an empty page — which is what "it fails on the panel" looks like.
           The padding-top trick is the pre-2021 way to hold a square, applied
           only where aspect-ratio is missing so modern browsers are untouched. */
        .tile {
            position: relative;
            aspect-ratio: 1;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            border: none;
            transition: transform 0.12s ease;
        }

        @supports not (aspect-ratio: 1 / 1) {
            .tile {
                height: 0;
                padding-top: 100%;
            }
        }

        .tile:active {
            transform: scale(0.96);
        }

        .tile-image {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tile-scrim {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0) 55%);
        }

        .tile-name {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 12px;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            line-height: 1.25;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        /* Sits opposite .tile-actions so the two never collide. Deliberately just
           the kind, not the filename: a 150px tile leaves ~60px here, which
           truncates any real filename to an unreadable stub. The tile's own name
           already identifies it; the filename lives in the hover title and the
           edit modal. */
        .tile-pdf-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            padding: 4px 9px;
            border-radius: 999px;
            background: rgba(15, 17, 21, 0.72);
            backdrop-filter: blur(2px);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tile-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
        }

        .tile-action-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50%;
            background: rgba(15, 17, 21, 0.55);
            backdrop-filter: blur(2px);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .tile-action-btn:hover {
            background: rgba(15, 17, 21, 0.8);
        }

        .tile-action-btn.delete:hover {
            background: rgba(204, 51, 51, 0.85);
        }

        .tile-add {
            background: #181b21;
            border: 2px dashed #333844;
            color: #5c6270;
            font-size: 36px;
            font-weight: 300;
        }

        /* The "+" is the only flow content any tile has. Under the padding-top
           square fallback the tile is height:0, so flow content would sit above
           the box — hence an absolutely positioned inner span, which centres
           identically whether the square comes from aspect-ratio or padding. */
        .tile-add-plus {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-add:hover {
            border-color: #4f8cff;
            color: #4f8cff;
        }

        .sync-status {
            font-size: 12px;
            color: #7d8290;
            text-align: center;
            margin-bottom: 15px;
            min-height: 16px;
        }

        .sync-status.error {
            color: #ff6b6b;
        }

        .file-input-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-input-wrap input[type="file"] {
            flex: 1;
            font-size: 13px;
            color: #9aa0ac;
        }

        .image-preview {
            max-width: 60px;
            max-height: 60px;
            border-radius: 6px;
            display: none;
            object-fit: cover;
        }

        .image-preview.active {
            display: block;
        }

        .remove-image-link {
            display: none;
            font-size: 12px;
            color: #ff6b6b;
            margin-top: 8px;
        }

        /* A PDF has no thumbnail, so the picked-file feedback is its name. */
        .file-chip {
            display: none;
            font-size: 12px;
            color: #9aa0ac;
            background: #12141a;
            border: 1px solid #333844;
            border-radius: 6px;
            padding: 6px 9px;
            max-width: 170px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-chip.active {
            display: block;
        }

        .remove-pdf-link {
            display: none;
            font-size: 12px;
            color: #ff6b6b;
            margin-top: 8px;
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
            padding: 30px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            width: 90vw;
            height: 90vh;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1c1f26;
            border: 1px solid #2a2d34;
            padding: 26px;
            border-radius: 14px;
            max-width: 90%;
            width: 420px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .modal-content h2 {
            margin-bottom: 20px;
            font-size: 18px;
            color: #fff;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
        }

        .btn-cancel {
            background: #333844;
        }

        .btn-cancel:hover {
            background: #40465a;
        }

        @media (max-width: 600px) {
            body {
                padding: 58px 14px 50px;
            }

            h1 {
                font-size: 24px;
            }

            .panel {
                padding: 16px;
            }

            .links-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                grid-gap: 10px;
                gap: 10px;
            }

            .modal-content {
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <nav class="topnav">
        <a class="topnav-link" href="https://kurgel-dashboard.netlify.app/">Family Dashboard</a>
        <a class="topnav-link" href="https://ecom-launchpad-mentor.netlify.app/">ECOM Launchpad</a>
        <a class="topnav-link" href="https://ansar-habits-tracker.netlify.app/">Ansar · ANSAR FC</a>
        <a class="topnav-link" href="https://kurgel-dashboard.netlify.app/board">Time Allocation Board</a>
        <a class="topnav-link" href="https://luxury-kringle-cf4171.netlify.app/">Link Board</a>
    </nav>

    <div class="top-bar">
        <a href="#" id="toggleTokenLink" onclick="toggleSyncTokenSection(event)">Sync Token</a>
    </div>

    <div class="container">
        <h1>Link Board</h1>
        <p class="page-subtitle">Tap a tile to open &middot; tap + to add a link, image, or PDF</p>

        <div class="sync-status" id="syncStatus"></div>

        <div class="panel" id="syncTokenSection" style="display: none;">
            <div class="panel-header">
                <h2>Sync Token</h2>
                <button class="panel-close" onclick="hideSyncTokenSection()" aria-label="Close">&times;</button>
            </div>
            <div class="form-group">
                <label for="syncToken">Needed once per device to save changes</label>
                <input type="text" id="syncToken" placeholder="paste your sync token">
            </div>
            <button onclick="saveSyncToken()" id="saveTokenBtn">Save Token</button>
        </div>

        <div class="panel" id="addFormSection" style="display: none;">
            <div class="panel-header">
                <h2>Add to Board</h2>
                <button class="panel-close" onclick="hideAddForm()" aria-label="Close">&times;</button>
            </div>
            <div class="form-group">
                <label for="linkName">Name</label>
                <input type="text" id="linkName" placeholder="e.g., Gmail, GitHub, News">
            </div>
            <div class="form-group">
                <label for="linkUrl">Link URL (optional if adding an image or PDF)</label>
                <input type="text" id="linkUrl" placeholder="e.g., https://gmail.com">
            </div>
            <div class="form-group">
                <label for="linkImage">Image or PDF (optional if adding a URL)</label>
                <div class="file-input-wrap">
                    <input type="file" id="linkImage" accept="image/*,application/pdf">
                    <img class="image-preview" id="linkImagePreview">
                    <span class="file-chip" id="linkPdfChip"></span>
                </div>
            </div>
            <button onclick="addLink()" id="addLinkBtn">Add</button>
        </div>

        <div class="links-grid" id="linksList"></div>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lightboxImg" alt="">
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2>Edit</h2>
            <div class="form-group">
                <label for="editName">Name</label>
                <input type="text" id="editName">
            </div>
            <div class="form-group">
                <label for="editUrl">Link URL (optional if there's an image or PDF)</label>
                <input type="text" id="editUrl">
            </div>
            <div class="form-group">
                <label for="editImage">Image or PDF (optional if there's a URL)</label>
                <div class="file-input-wrap">
                    <input type="file" id="editImage" accept="image/*,application/pdf">
                    <img class="image-preview" id="editImagePreview">
                    <span class="file-chip" id="editPdfChip"></span>
                </div>
                <a href="#" id="removeEditImageLink" class="remove-image-link" onclick="removeEditImage(event)">Remove image</a>
                <a href="#" id="removeEditPdfLink" class="remove-pdf-link" onclick="removeEditPdf(event)">Remove PDF</a>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button onclick="saveEdit()" id="saveEditBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Built by scripts/build.mjs from src/app.js to a CONTENT-HASHED filename
         under /assets, which this tag is rewritten to point at. Do not edit the
         src by hand — run `npm run build`.

         The hash is what lets the bundle be cached forever while the HTML
         revalidates: fresh markup can only ever request the bundle it was built
         with, so an old bundle cannot pair with new HTML. That pairing is the
         whole point — the Flip panel showed an old board because it was serving
         a stale cached copy of the site, not because of anything it couldn't
         parse (it is Chromium 108 and supports everything here).

         Still esbuild --format=iife --target=chrome58, and still a classic
         script rather than type="module": harmless on a modern engine, and it
         keeps the door open for genuinely old clients. -->
    <script src="/assets/app.legacy.734cf4a6c6.js"></script>
</body>
</html>
