[build]
  # app.legacy.js is the only script the browser runs, and it is generated, so
  # the site is no longer buildless. The built bundle is committed as well, so a
  # broken build degrades to serving the last good bundle instead of leaving
  # every device with a blank board.
  command = "npm run build"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# These per-context commands OVERRIDE [build].command rather than adding to it.
# While they were `echo` strings the real build would have been skipped on every
# production and preview deploy — the two contexts that actually matter — so they
# have to run the build too.
[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

# ── CACHING ────────────────────────────────────────────────────────────────
# The Samsung Flip panel was showing an old board because it held a stale copy
# of the site; ?diag=1 cache-busted it and the current build rendered fine. So
# the rule is: the HTML must revalidate on every load, and the thing it points
# at must be immutable.
#
# index.html revalidates, so a deploy is picked up on the next load rather than
# whenever a device decides its copy is old.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate, max-age=0"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate, max-age=0"

# The bundle is content-hashed (assets/app.legacy.<hash>.js), so a given URL's
# bytes can never change — it is safe to cache forever, and a new build is a new
# URL that no cache has seen. Fresh HTML therefore cannot pair with an old
# bundle: the pairing is the filename.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Transitional: the pre-fingerprint bundle at the root. Any device still holding
# stale HTML asks for this path, and deleting it would turn that stale-but-working
# board into a blank screen. It revalidates so those devices roll forward, and it
# can be deleted once they have.
[[headers]]
  for = "/app.legacy.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate, max-age=0"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
